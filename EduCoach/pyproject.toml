[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "educoach-core"
version = "0.1.0"
description = "EduCoach genel öğrenme ve eğitim koçluğu çekirdeği"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
