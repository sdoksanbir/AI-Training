[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "educoach-core"
version = "0.1.0"
description = "EduCoach genel öğrenme ve eğitim koçluğu çekirdeği"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142,<1",
    "pydantic>=2.13,<3",
    "pwdlib[argon2]>=0.3,<1",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
]

[project.scripts]
educoach = "educoach.cli:main"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
"educoach.specialties.profiles" = [
    "ales.json",
    "general_english.json",
    "school_7.json",
    "yks.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
